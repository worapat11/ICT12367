<!DOCTYPE html>
<html>
<head>
    <title>Vet Clinic System</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(90deg, #1f2937 0%, #111827 100%); border-bottom: 1px solid #334155;">
<div class="container">
<a class="navbar-brand" href="/">Vet Clinic</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="mainNav">
<ul class="navbar-nav me-auto mb-2 mb-lg-0">
<li class="nav-item"><a class="nav-link" href="/owners">เจ้าของสัตว์</a></li>
<li class="nav-item"><a class="nav-link" href="/pets">สัตว์เลี้ยง</a></li>
<li class="nav-item"><a class="nav-link" href="/medical_records">ประวัติการรักษา</a></li>
<li class="nav-item"><a class="nav-link" href="/appointments">นัดหมาย</a></li>
<li class="nav-item"><a class="nav-link" href="/medicines">สต็อกสินค้า</a></li>
<li class="nav-item"><a class="nav-link" href="/pos">POS</a></li>
<li class="nav-item"><a class="nav-link" href="/reports">รายงาน</a></li>
</ul>
</div>
</div>
</nav>
<div class="container mt-4">
{% if 'report_' in request.resolver_match.url_name %}
<a href="/reports" class="btn btn-secondary btn-sm mb-3 d-print-none">Back</a>
{% endif %}
{% block content %}
{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
