{% extends 'base.html' %}

{% block content %}
<div class="card main-card p-4">
  <h2 class="mb-3">เพิ่มประวัติการรักษา</h2>
  <form method="POST">
    {% csrf_token %}
    <div class="mb-3">
      <p class="text-muted">รหัสประวัติจะสร้างอัตโนมัติ</p>
    </div>
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <div class="mb-3">
      <label class="form-label">สัตว์เลี้ยง</label>
      <select name="pet" class="form-select">
        {% for p in pet %}
        <option value="{{ p.pet_id }}">{{ p.pet_name }}</option>
        {% endfor %}
      </select>
    </div>

<div class="mb-3">
<label>สัตวแพทย์</label>
<select name="veterinarian" class="form-control">
{% for v in vets %}
<option value="{{ v.vet_id }}">{{ v.vet_name }}</option>
{% endfor %}
</select>
</div>

    <div class="mb-3">
      <label class="form-label">วันที่</label>
      <input type="date" name="visit_date" class="form-control" value="{{ today|default:'' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">การวินิจฉัย</label>
      <textarea name="diagnosis" class="form-control"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">ระบุการรักษา</label>
      <textarea name="treatment" class="form-control"></textarea>
    </div>
    <h5>ยา</h5>
    <div class="row mb-2">
      <div class="col-md-8">
        <select name="medicine" class="form-select">
          <option value="">-- เลือกยา --</option>
          {% for m in medicines %}
          <option value="{{ m.medicine_id }}">{{ m.medicine_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <input type="number" min="1" name="quantity" class="form-control" placeholder="Quantity">
      </div>
    </div>
    <p class="text-muted">(สามารถเพิ่มได้หลายรายการโดยกดบันทึกทีละครั้ง หรือเพิ่มฟังก์ชัน JS ภายหลัง)</p>
    <div class="d-flex gap-2">
      <button class="btn btn-primary">บันทึก</button>
      <a href="/medical_records/" class="btn btn-secondary">ยกเลิก</a>
    </div>
  </form>
</div>
{% endblock %}
