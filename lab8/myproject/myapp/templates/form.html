{% extends "base.html"%}

{% block title %}
<title>แบบฟอร์มสมัครสมาชิก</title>
{% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>แบบฟอร์มกรอกข้อมูล</title>
    <style>
        body {
            background-color: #f5f5f5;
        }
        .card-custom {
            max-width: 600px;
            margin: 80px auto;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border-radius: 10px;
        }
        .card-header {
            background-color: #0d6efd;
            color: white;
            font-size: 22px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card card-custom">
    <div class="card-header">
        แบบฟอร์มบันทึกข้อมูลประชากร
    </div>
    <div class="card-body">

        <form action="#" method="post">
            
            <div class="mb-3">
                <label class="form-label">ชื่อประชากร</label>
                <input type="text" class="form-control" 
                       placeholder="กรุณากรอกชื่อ-นามสกุล" required>
            </div>

            <div class="mb-3">
                <label class="form-label">อายุ</label>
                <input type="number" class="form-control" 
                       placeholder="กรอกข้อมูลอายุเป็นตัวเลข" required>
            </div>

            <button type="submit" class="btn btn-success">
                ลงทะเบียน
            </button>

            <button type="reset" class="btn btn-danger">
                ล้างข้อมูล
            </button>

        </form>

    </div>
</div>
{% endblock %}
