<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>แบบฟอร์มกรอกข้อมูล</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 350px;
        }

        .card h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background-color: #4e73df;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2e59d9;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>แบบฟอร์มสมัครสมาชิก</h2>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>ชื่อ</label>
            <input type="text" name="fname" required>
        </div>

        <div class="form-group">
            <label>นามสกุล</label>
            <input type="text" name="lname" required>
        </div>

        <div class="form-group">
            <label>อีเมล</label>
            <input type="email" name="email" required>
        </div>

        <div class="form-group">
            <label>ระดับผู้ใช้</label>
            <select name="role" required>
                <option value="">-- เลือกระดับ --</option>
                <option value="User">User</option>
                <option value="Admin">Admin</option>
            </select>
        </div>

        <button type="submit">บันทึกข้อมูล</button>
    </form>
</div>

</body>
</html>
